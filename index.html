
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart - Human Resources System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">

   
</head>
<body>
    <div class="hero-section">
        <!-- Floating background elements -->
        <div class="floating-elements">
            <i class="fas fa-users floating-icon"></i>
            <i class="fas fa-chart-line floating-icon"></i>
            <i class="fas fa-calendar-alt floating-icon"></i>
            <i class="fas fa-briefcase floating-icon"></i>
        </div>

        <!-- Particle system -->
        <div class="particles" id="particles"></div>

        <!-- Main content -->
        <div class="hero-content">
            <!-- Logo Section -->
            <div class="logo-container">
                <div class="logo">
                    <img src="assets/logoo.png">
                </div>
                <div class="logo-text"></div>
            </div>

            <h4 class="hero-title">Smart HR Management (SaaS)</h4>
            <!-- <h2 class="hero-subtitle">Next-Generation Human Resources Management</h2> -->
            <p class="hero-description">
                HR System which perfect for managing your own organization and also earning more revenues by serving other companies.
            </p>
            
            <div class="btn-container">
                <a href="https://hr.prosofteg.com/" target="_blank" class="btn btn-custom btn-demo" id="liveDemoBtn">
                    <i class="fas fa-play me-2"></i>
                    Live Demo
                </a>
                <a href="https://hr-documentationn.vercel.app/" target="_blank" class="btn btn-custom btn-docs" id="docsBtn">
                    <i class="fas fa-book me-2"></i>
                    Documentation
                </a>
            </div>

            <!-- Demo Credentials Section -->
            <div class="demo-credentials">
                <h5><i class="fas fa-key me-2"></i>Demo Access Credentials</h5>
                <div class="credentials-grid">
                    <div class="credential-item" onclick="copyToClipboard('Company@gmail.com', this)">
                        <div class="label">Email</div>
                        <div class="value">Company@gmail.com</div>
                        <div class="copy-notification">Copied!</div>
                    </div>
                    <div class="credential-item" onclick="copyToClipboard('CompanyCompany', this)">
                        <div class="label">Password</div>
                        <div class="value">CompanyCompany</div>
                        <div class="copy-notification">Copied!</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js.js"></script>

</body>
</html>
